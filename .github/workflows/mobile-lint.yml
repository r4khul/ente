name: "Lint (Mobile)"

on:
    pull_request:
        paths:
            - ".github/workflows/mobile-lint.yml"
            - "mobile/**"
            - "!mobile/native/**"
            - "rust/apps/codegen/**"
            - "rust/bindings/frb/**"
            - "rust/Cargo.lock"
            - "rust/Cargo.toml"
            - "rust/crates/contacts/**"
            - "rust/crates/core/**"
            - "rust/crates/image/**"
            - "rust/crates/photos/**"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    RUSTFLAGS: -D warnings

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code and submodules
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  submodules: recursive

            - name: Check whether lint-relevant files changed in this PR
              uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              id: filter
              with:
                  predicate-quantifier: 'some-with-excludes'
                  filters: |
                      code:
                          - ".github/workflows/mobile-lint.yml"
                          - "mobile/**"
                          - "!mobile/native/**"
                          - "!mobile/**/*.md"
                          - "rust/apps/codegen/**"
                          - "rust/bindings/frb/**"
                          - "rust/Cargo.lock"
                          - "rust/Cargo.toml"
                          - "rust/crates/contacts/**"
                          - "rust/crates/core/**"
                          - "rust/crates/image/**"
                          - "rust/crates/photos/**"
                          - "!rust/**/*.md"

            - name: Determine whether checks should run
              id: gate
              run: echo "run=${{ steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"

            - name: Verify frozen mobile pubspecs
              if: steps.gate.outputs.run == 'true'
              run: ruby mobile/scripts/check_frozen_pubspecs.rb mobile

            - name: Verify source ARB plurals
              if: steps.gate.outputs.run == 'true'
              run: ruby mobile/scripts/check_source_arb_plurals.rb

            - name: Verify auth custom icons
              if: steps.gate.outputs.run == 'true'
              run: |
                  find assets/custom-icons -type f -name "*.svg" | while read -r file; do
                      name=$(basename "$file")
                      if [[ "$name" != "$(printf "%s" "$name" | tr '[:upper:]' '[:lower:]' | tr ' ' '_')" ]]; then
                          echo "File name is not lowercase: $file"
                          exit 1
                      fi

                      if [[ "$file" == "assets/custom-icons/icons/bbs_nga.svg" ]]; then
                          continue
                      fi

                      size=$(wc -c < "$file")
                      if (( size > 20480 )); then
                          echo "File size is greater than 20KB: $file ($size bytes)"
                          exit 1
                      fi
                  done

                  jq empty assets/custom-icons/_data/custom-icons.json
                  jq -r '.icons[] | select(.hex != null) | .hex' assets/custom-icons/_data/custom-icons.json | while read -r hex; do
                      if [[ -n "$hex" && ! "$hex" =~ ^[0-9a-fA-F]{6}$ ]]; then
                          echo "Invalid hex color '$hex'. Must be exactly 6 hexadecimal characters."
                          exit 1
                      fi
                  done
              working-directory: mobile/apps/auth

            - name: Install Flutter
              if: steps.gate.outputs.run == 'true'
              uses: ./.github/actions/setup-flutter

            # Restore-only; primed on main by warm-caches.yml.
            - name: Restore Rust cache
              if: steps.gate.outputs.run == 'true'
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
              with:
                  workspaces: rust
                  shared-key: rust-flutter
                  save-if: false

            - if: steps.gate.outputs.run == 'true'
              run: cargo codegen frb
              working-directory: rust

            - if: steps.gate.outputs.run == 'true'
              run: cargo clippy -p ente_photos_rust --features flutter --all-targets --locked
              working-directory: rust

            - if: steps.gate.outputs.run == 'true'
              run: cargo clippy -p ente_rust --features flutter --all-targets --locked
              working-directory: rust

            - if: steps.gate.outputs.run == 'true'
              run: flutter pub get --enforce-lockfile
              working-directory: mobile

            - if: steps.gate.outputs.run == 'true'
              run: dart format --output=none --set-exit-if-changed .
              working-directory: mobile

            - if: steps.gate.outputs.run == 'true'
              run: flutter analyze --no-pub
              working-directory: mobile

            - name: Test
              if: steps.gate.outputs.run == 'true'
              working-directory: mobile
              run: |
                  test_package() (
                      member=${1#"$PWD/"}
                      echo "Testing $member"
                      cd "$member"
                      flutter test --no-pub
                  )
                  export -f test_package

                  dart pub workspace list --json |
                      jq -r '.packages[] | select(.name != "ente_workspace") | .path' |
                      while IFS= read -r member; do
                          if [[ -d "$member/test" ]]; then
                              printf '%s\n' "$member"
                          fi
                      done |
                      xargs -P4 -n1 bash -e -c 'test_package "$1"' _
